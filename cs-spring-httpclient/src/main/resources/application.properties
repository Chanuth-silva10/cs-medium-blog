spring.application.name=cs-spring-httpclient
server.port=7460

# Which Task API to call, and who we are. The email and password come from environment variables,
# so no secret ever sits in the repository. If they are missing, the app refuses to start.
devcraft.task-api.base-url=${TASK_API_URL:http://localhost:4500}
devcraft.task-api.email=${TASK_API_EMAIL:}
devcraft.task-api.password=${TASK_API_PASSWORD:}

# rest-template (default) or rest-client
devcraft.task-api.client=rest-template
devcraft.task-api.connect-timeout=2s
devcraft.task-api.read-timeout=5s

# Never put stack traces in API responses
spring.web.error.include-stacktrace=never
