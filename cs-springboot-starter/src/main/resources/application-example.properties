server.port=7450

spring.datasource.url=jdbc:mysql://localhost:3308/your_database?serverTimezone=UTC&useSSL=false
spring.datasource.username=your_user
spring.datasource.password=your_password

# Hibernate only validates the schema. Flyway owns it (see the migrations chapter).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/docs
springdoc.packages-to-scan=io.chanuth.starter.controllers
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true

# Logging (the files are written by logback-spring.xml)
logging.level.web=INFO
logging.file.path=logs

# Never put stack traces in API responses (DevTools turns them on by default)
spring.web.error.include-stacktrace=never
