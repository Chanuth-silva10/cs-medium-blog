name: DevCraft Task API workflow

on:
  pull_request:
    branches: [main]
    paths:
      - 'cs-devcraft-task-api/src/**'
      - 'cs-devcraft-task-api/package*.json'
      - 'cs-devcraft-task-api/Dockerfile'
      - '.github/workflows/devcraft-task-api.yaml'
  push:
    branches: [main]
    paths:
      - 'cs-devcraft-task-api/src/**'
      - 'cs-devcraft-task-api/package*.json'
      - 'cs-devcraft-task-api/Dockerfile'
      - '.github/workflows/devcraft-task-api.yaml'

permissions:
  contents: read

# Never run two deployments at once. Pull request runs can be cancelled when a newer commit arrives.
concurrency:
  group: devcraft-task-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cs-devcraft-task-api
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cs-devcraft-task-api/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker-build:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - project-build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: cs-devcraft-task-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devcraft-task-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devcraft-task-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the SSH files
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$SERVER_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Deploy to the server
        working-directory: cs-devcraft-task-api
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          KEY_FILE: ${{ runner.temp }}/deploy_key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devcraft-task-api:${{ github.sha }}
        run: bash deploy.sh
