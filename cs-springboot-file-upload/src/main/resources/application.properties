spring.application.name=cs-springboot-file-upload
server.port=7500

# Where receipts are stored. A relative path is resolved from the folder the app starts in.
app.storage.location=${STORAGE_LOCATION:./uploads/receipts}

# Uploads above these sizes are refused with 413 before the file ever reaches our code.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.web.error.include-stacktrace=never
