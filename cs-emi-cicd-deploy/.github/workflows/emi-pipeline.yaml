name: EMI pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/emi-pipeline.yaml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/emi-pipeline.yaml'

# Nothing in this workflow needs to write to the repository.
permissions:
  contents: read

env:
  IMAGE_NAME: cs-emi

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the tests
        run: mvn --batch-mode --no-transfer-progress verify

  publish:
    # Only after a merge on main, never for a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute the image name and tags
        id: meta
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "image=${REGISTRY_USER}/${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY_USER}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A GitHub environment can require a manual approval before the production deploy.
    environment: production
    # Two deployments at once would fight for the same container.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the SSH connection
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          # The server's public host key, saved once as a secret: no blind trust of the first answer.
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy on the server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$IMAGE" < deploy/remote-deploy.sh
      - name: Check the public URL
        if: ${{ vars.APP_URL != '' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "$APP_URL/actuator/health"
