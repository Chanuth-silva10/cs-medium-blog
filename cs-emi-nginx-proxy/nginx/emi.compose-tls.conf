# What the site looks like once HTTPS is on. On a real server Certbot writes these lines for you
# (see the article); here a self-signed certificate lets you try the same configuration locally.
# Generate the certificate with the command in the README.
server {
    listen 80 default_server;
    server_name _;
    # Every plain HTTP request is sent to HTTPS.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/emi.crt;
    ssl_certificate_key /etc/nginx/certs/emi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:7540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
