# The same site, for the docker compose setup of this project: Nginx reaches the application by
# its service name "app" on the Docker network, and any host name is accepted.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://app:7540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the first proxy, so it states who connected. A value sent by the client is dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

