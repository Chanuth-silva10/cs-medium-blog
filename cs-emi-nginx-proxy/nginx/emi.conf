# The Nginx site for a server where the application runs in Docker with "-p 127.0.0.1:7540:7540".
# Save it as /etc/nginx/sites-available/emi.203-0-113-10.sslip.io and enable it with a symbolic link.
server {
    listen 80;
    server_name emi.203-0-113-10.sslip.io;

    access_log /var/log/nginx/emi.access.log;
    error_log  /var/log/nginx/emi.error.log error;

    location / {
        proxy_pass http://127.0.0.1:7540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the first proxy, so it states who connected. A value sent by the client is dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

