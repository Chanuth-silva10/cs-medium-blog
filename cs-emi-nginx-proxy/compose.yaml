services:
  app:
    build: .
    image: devcraft/emi:local
    restart: unless-stopped
    environment:
      # Memory limits are read from the container, 75% of it goes to the Java heap.
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    expose:
      - "7540"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/emi.compose.conf:/etc/nginx/conf.d/default.conf:ro
  # Optional: the same site over HTTPS with a self-signed certificate. Start it with
  #   docker compose --profile tls up -d nginx-tls
  nginx-tls:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/emi.compose-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
