spring.application.name=cs-springboot-mongodb
server.port=7510
# Connection to MongoDB. The defaults match the docker command in the README: change them for
# any real database and pass the password through the environment.
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.username=${MONGO_USER:devcraft}
spring.mongodb.password=${MONGO_PASSWORD:devcraftPwd}
spring.mongodb.authentication-database=admin
spring.mongodb.database=${MONGO_DATABASE:devcraft_clubs}
# Create the indexes declared with @Indexed when the application starts.
spring.data.mongodb.auto-index-creation=true
# Load demo clubs and runners at startup, only when the clubs collection is empty.
app.seed.enabled=${SEED_DEMO_DATA:false}
spring.web.error.include-stacktrace=never
