spring.application.name=cs-mail-consumer
# RabbitMQ connection. The defaults match the docker command in the README.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:devcraft}
spring.rabbitmq.password=${RABBIT_PASSWORD:devcraftPwd}
spring.rabbitmq.virtual-host=/
# A failing message is tried 3 times in all (the first try and 2 retries, 500 ms then 1 s apart),
# then it goes to the dead letter queue.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Demo switch: make every email fail, to watch retries and the dead letter queue.
app.mail.simulate-outage=${SIMULATE_MAIL_OUTAGE:false}

