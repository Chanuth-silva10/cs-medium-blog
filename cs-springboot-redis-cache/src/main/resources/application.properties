spring.application.name=cs-springboot-redis-cache
server.port=7480

# MySQL holds the catalogue. The password comes from the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/devcraft_catalog?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:devcraft}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Redis holds the cache.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Give up on Redis quickly, so a Redis outage costs half a second per request, not a hang.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# How slow the "database" is, and how long each cache keeps its entries.
app.catalog.simulated-delay=2s
app.catalog.products-ttl=10m
app.catalog.search-ttl=2m
app.catalog.categories-ttl=1h

spring.web.error.include-stacktrace=never
