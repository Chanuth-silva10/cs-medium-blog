# In-memory database in MySQL mode, so the same Flyway migrations and seed data are used.
spring.datasource.url=jdbc:h2:mem:devcraft_catalog;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# The caching rules are tested with Spring's simple in-memory cache; Redis itself is checked by hand.
spring.cache.type=simple
app.catalog.simulated-delay=0s
