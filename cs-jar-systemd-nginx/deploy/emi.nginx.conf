# Save as /etc/nginx/sites-available/emi.203-0-113-10.sslip.io and link it into sites-enabled.
server {
    listen 80;
    server_name emi.203-0-113-10.sslip.io;

    access_log /var/log/nginx/emi.access.log;
    error_log  /var/log/nginx/emi.error.log error;

    location / {
        proxy_pass http://127.0.0.1:7570;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the first proxy: it states who connected and drops what the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
