spring.application.name=cs-emi
server.port=7570
# Behind a reverse proxy: trust the X-Forwarded-* headers, so the application sees the real client
# address and the https scheme instead of the proxy's.
server.forward-headers-strategy=native
# On shutdown, finish the requests in progress first.
server.shutdown=graceful
# /actuator/health is the only endpoint exposed: Docker and the deployment use it.
management.endpoints.web.exposure.include=health
spring.web.error.include-stacktrace=never

# Only Nginx on this server may reach the application.
server.address=127.0.0.1
