spring.application.name=cs-springboot-bookshelf
server.port=7490

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/devcraft_bookshelf?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:devcraft}
spring.datasource.password=${DB_PASSWORD:}

# Flyway creates and fills the tables; Hibernate only checks them.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Set to true to see every SQL statement Hibernate sends.
spring.jpa.show-sql=false

spring.web.error.include-stacktrace=never
