name: devcraft-mongo-rs

# A three member replica set. Every member listens on its own port, the same port inside and
# outside Docker, so the member addresses that MongoDB announces (mongo1:27021, ...) are also
# valid for a program running on your computer once mongo1, mongo2 and mongo3 point to 127.0.0.1.
x-mongo: &mongo
  image: mongo:7.0.14
  restart: unless-stopped
  networks:
    - mongors

services:
  mongo1:
    <<: *mongo
    container_name: mongo1
    command: ["mongod", "--replSet", "dbrs", "--bind_ip_all", "--port", "27021"]
    ports:
      - "27021:27021"
    volumes:
      - mongo1-data:/data/db
    healthcheck: &health
      test: ["CMD", "mongosh", "--port", "27021", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  mongo2:
    <<: *mongo
    container_name: mongo2
    command: ["mongod", "--replSet", "dbrs", "--bind_ip_all", "--port", "27022"]
    ports:
      - "27022:27022"
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      <<: *health
      test: ["CMD", "mongosh", "--port", "27022", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  mongo3:
    <<: *mongo
    container_name: mongo3
    command: ["mongod", "--replSet", "dbrs", "--bind_ip_all", "--port", "27023"]
    ports:
      - "27023:27023"
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      <<: *health
      test: ["CMD", "mongosh", "--port", "27023", "--quiet", "--eval", "db.adminCommand('ping').ok"]

  # Starts after the three members answer, creates the replica set, then stops.
  rs-init:
    <<: *mongo
    container_name: mongo-rs-init
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./scripts/rs-init.js:/scripts/rs-init.js:ro
    entrypoint: ["mongosh", "--host", "mongo1", "--port", "27021", "--quiet", "--file", "/scripts/rs-init.js"]

networks:
  mongors:

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
