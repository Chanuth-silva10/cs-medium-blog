# Real environments: the database and the secrets come from the environment, and Docker Compose
# support is switched off so the application never starts containers on a server.
spring.docker.compose.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret-key=${JWT_SECRET_KEY}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
