spring.application.name=cs-springboot-compose-dev
server.port=7530
# Local development is the default profile: Docker Compose starts MySQL, nothing to install or configure.
# In a real environment run with SPRING_PROFILES_ACTIVE=prod (see application-prod.properties).
spring.profiles.default=dev
# Flyway owns the schema (Chapter 15); Hibernate only checks it.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
security.jwt.expiration=1h
# Browser frontends allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.web.error.include-stacktrace=never
