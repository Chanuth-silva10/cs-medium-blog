spring.application.name=cs-springboot-auth-api
server.port=7470

# Database. The password has no default, so it must come from the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/devcraft_auth?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:devcraft}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (Chapter 15); Hibernate only checks it.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# JWT. Generate a key with: openssl rand -base64 32
security.jwt.secret-key=${JWT_SECRET_KEY:}
security.jwt.expiration=1h

# The first super admin, created at startup only if both values are set.
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# Browser frontends allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.web.error.include-stacktrace=never
